[package]
name = "rcai-desktop"
version = "0.2.0-beta.1"
description = "Realtime Character AI desktop shell"
edition = "2021"

[lib]
name = "rcai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
