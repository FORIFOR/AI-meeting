name: Prepare owned marketing links
on:
  push:
    branches: [docs/reachmade-site-migration-20260919]
    paths: [.github/workflows/owned-doc-links.yml]
permissions:
  contents: write
jobs:
  links:
    if: github.ref == 'refs/heads/docs/reachmade-site-migration-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - name: Replace only the retired marketing host in the two READMEs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urlsplit
          host='https://ai-meeting.forifor.chatgpt.site'
          pattern=re.compile(re.escape(host)+r'[^\s)\]"<>]*')
          for name,lang in [('README.md','en'),('README.ja.md','ja')]:
              p=Path(name);old=p.read_text();prefix='/en' if lang=='en' else ''
              app_urls=re.findall(r'https://ai-meeting\.web\.app[^\s)\]]*',old)
              def route(match):
                  u=urlsplit(match.group())
                  if u.fragment=='business':return 'https://reachmade.com'+prefix+'/contact/'
                  if u.path.endswith('.mp4') or u.path.endswith('.jpg'):
                      return 'https://reachmade.com/media/originals/ai-meeting'+u.path
                  return 'https://reachmade.com'+prefix+'/products/ai-meeting/guide/'
              new=pattern.sub(route,old)
              intro='[Website and usage guide](https://reachmade.com/en/products/ai-meeting/guide/)' if lang=='en' else '[製品サイト・利用案内](https://reachmade.com/products/ai-meeting/guide/)'
              if intro not in new:new=new.replace('# AI Meeting\n','# AI Meeting\n\n'+intro+'\n',1)
              assert re.findall(r'https://ai-meeting\.web\.app[^\s)\]]*',new)==app_urls
              assert host not in new and len(new)>len(old)*.95
              p.write_text(new)
          PY
          git diff --check
          git diff --stat
          git diff -- README.md README.ja.md
      - name: Commit the documentation-only patch to its branch
        run: |
          git add README.md README.ja.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Use Reachmade for product guidance and business inquiries; retain app links'
          git push origin HEAD:refs/heads/docs/reachmade-site-migration-20260919
