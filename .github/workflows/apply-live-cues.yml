name: Integrate and verify live cues

on:
  push:
    branches: [feat/live-meeting-cues-20260919]

permissions:
  contents: write

concurrency:
  group: apply-live-cues-feature-only
  cancel-in-progress: true

jobs:
  integrate:
    if: github.repository == 'FORIFOR/AI-meeting' && github.ref == 'refs/heads/feat/live-meeting-cues-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply exact reviewed integration
        run: node scripts/verification/verify-live-cue-integration.mjs
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.12.2 --activate
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Complete test suite
        run: pnpm test
      - name: Standard web production build
        run: pnpm --filter @rcai/web exec vite build
      - name: OSS build and distribution audit
        run: pnpm build:oss
      - name: Existing project browser acceptance
        run: |
          set -eu
          pnpm --filter @rcai/web exec vite preview --mode oss --host 127.0.0.1 --port 5180 > /tmp/live-cue-preview.log 2>&1 &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5180/ > /dev/null; then break; fi
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node scripts/verification/project-browser.mjs
      - name: Commit only tested source to feature branch
        run: |
          set -eu
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/conversation-core/src/index.ts packages/conversation-core/src/liveCues.ts packages/conversation-core/src/liveCues.test.ts
          git add services/token-broker/src/env.ts services/token-broker/src/app.ts services/token-broker/src/routes/liveCues.ts services/token-broker/.env.example services/token-broker/src/routes/liveCues.test.ts
          git add apps/web/src/components/LiveCuePanel.tsx apps/web/src/screens/Session.tsx apps/web/src/session/useSession.ts apps/web/src/session/SessionController.ts apps/web/src/session/SessionController.lifecycle.test.ts apps/web/src/session/liveCueClient.ts apps/web/src/session/liveCueClient.test.ts
          git commit -m 'Integrate live cues into session UI and broker after full verification'
          git push origin HEAD:refs/heads/feat/live-meeting-cues-20260919
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-cue-integration-evidence
          path: test-results/project-browser
          if-no-files-found: ignore
          retention-days: 7
