name: "Beta feedback / 3分試した感想"
description: "No coding needed. Tell us what worked, felt odd, or stopped you. / 動いたこと・気になったことを教えてください。"
title: "[Feedback] "
labels: ["beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying AI Meeting! One concrete observation is enough. English and Japanese are welcome.
        試していただきありがとうございます。ひとことでも、日本語でも英語でも構いません。
        [Free browser preview / 無料プレビュー](https://ai-meeting.web.app/vrm-demo) · [3-minute guide / 試し方](https://github.com/FORIFOR/AI-meeting/blob/main/TESTING.ja.md)
        This report is public. Leave out private audio, API keys, and personal information.
  - type: dropdown
    id: experience
    attributes:
      label: "What did you try? / 試したもの"
      options:
        - "Browser voice/avatar preview / ブラウザーの音声・表情"
        - "My own VRM or audio / 自分のVRM・音声"
        - "Self-hosted AI conversation / セルフホストのAI会話"
        - "Setup or installation / 起動・インストール"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Device and browser / 端末・ブラウザー"
      placeholder: "e.g. iPhone + Safari, Windows + Chrome, Android + Firefox"
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: "What worked or needs improving? / 動いたこと・直してほしいこと"
      description: "One observation is enough, including 'I could not open it'. / 「開けなかった」「口の動きが気になる」だけでも構いません。"
      placeholder: "I pressed… and expected… but saw/heard… / …を押すと、…になりました。"
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: "When would you use it? / どんな場面で使いたいですか？（任意）"
      description: "What would need to improve before you would use it again? / また使うために必要な改善でも構いません。"
